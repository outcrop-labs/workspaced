[package]
name = "workspaced"
version = "0.1.1"
description = "Multi-account Google Workspace desktop"
authors = ["Outcrop Labs"]
license = "MIT"
repository = "https://github.com/outcrop-labs/workspaced"
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
anyhow = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
tauri = { version = "2.12.0", features = ["unstable"] }
tauri-utils = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
notify-rust = "4"
notify = "8"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
webkit2gtk = { version = "=2.0", features = ["v2_40"] }
